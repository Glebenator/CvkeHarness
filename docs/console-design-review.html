async function render(){clearInterval(motionTimer);motionTimer=null;play.textContent="Play motion";play.disabled=true;try{data=versions[version.value];let w=parseInt(size.value);let f=data.find(f=>f.Scene===scene.value&&f.Width===w&&f.Theme===theme.value);if(!f){screen.textContent="This screen was added in the navigation pass.";caption.textContent="No earlier version";return;}screen.innerHTML=ansi(f.Text);play.disabled=!f.Animation?.length;play.onclick=()=>{if(motionTimer){clearInterval(motionTimer);motionTimer=null;play.textContent="Play motion";return;}let i=0;play.textContent="Pause motion";motionTimer=setInterval(()=>{screen.innerHTML=ansi(f.Animation[i++%f.Animation.length]);},120);};screen.className=theme.value;screen.style.zoom="1";if(fit.checked){screen.style.zoom=Math.min(1,screen.parentElement.clientWidth/screen.scrollWidth)}caption.textContent=`${version.value} · ${scene.value} · ${size.value} · ${theme.value}`;}catch(e){caption.textContent='This version has not been exported yet.'}}
// Avoid the built-in window.screen binding.
const screen=document.getElementById('screen');
[version,scene,size,theme,fit].forEach(s=>s.onchange=render);previous.onclick=()=>{scene.selectedIndex=(scene.selectedIndex+names.length-1)%names.length;render()};next.onclick=()=>{scene.selectedIndex=(scene.selectedIndex+1)%names.length;render()};render();
</script>
