name: Platform build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and platform checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build the application
        run: go build -o cvkeharness-ci.exe .
      - name: Start the compiled CLI
        run: ./cvkeharness-ci.exe --help
      - name: Check platform support, state persistence, runtime registration and calculator
        run: go test ./recovery ./tools ./cmd ./state -run '^(TestRecoveryPlatform.*|TestStatePlatform.*|TestDefaultRegistryRecoveryPlatformSupport)$' -count=1
      - name: Cross-compile Windows ARM64
        if: runner.os == 'Windows'
        env:
          GOARCH: arm64
        run: go build -o cvkeharness-arm64-ci.exe .
